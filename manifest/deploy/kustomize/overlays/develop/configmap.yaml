apiVersion: v1
kind: ConfigMap
metadata:
  name: template-single-configmap
data:
  config.yaml: |
    server:
      address:     ":8000"
      openapiPath: "/api.json"
      swaggerPath: "/swagger"

    logger:
      level : "all"
      stdout: true

    traffic:
      mqtt:
        enabled: false
        broker: "tcp://iot-mqtt.qi-cloud.com:1883"
        topic: "zh-iot-jinshan-kakou"
        clientIdPrefix: "jinshan_"
        username: "jinshan"
        password: ""
        qos: 1
      ingest:
        dedupeWindowDays: 7
        rawPayloadRetainDays: 30
        noDataWarnMinutes: 30
