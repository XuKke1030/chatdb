# ChatDB 配置文件

server:
  address: ":8000"
  mode: "debug"

ai:
  openai:
    baseUrl: "https://api.openai.com/v1"
    key: "622000f3-1550-4cf7-b282-f681d9ec8d78"
  deepseek:
    baseUrl: "https://api.deepseek.com"
    key: "sk-e11af6f5a4aa41bf8eabff127c22b8dc"
  mcp:
    address: ":9000"
  asr:
    baseUrl: ""
    key: ""
    model: "whisper-1"

jwt:
  - subject: "ai-chat-user"
    secret: "chatdb-jwt-secret-key-2024"
    expire: 24
    issuer: "chatdb"

db:
  readonly: false

traffic:
  mqtt:
    enabled: false
    broker: "tcp://iot-mqtt.qi-cloud.com:1883"
    topic: "zh-iot-jinshan-kakou"
    clientIdPrefix: "jinshan_"
    username: "jinshan"
    password: ""
    qos: 1
  ingest:
    dedupeWindowDays: 7
    rawPayloadRetainDays: 30
    noDataWarnMinutes: 30

qa:
  webSearch:
    enabled: false
    provider: "local"
    baseUrl: ""
    key: ""
  sync:
    provider: "local" # local | aidgp
    aidgp:
      baseUrl: ""
      appKey: ""
      appSecret: ""
      tokenPath: "/openapi/oauth/token"
      trafficQueryPath: "/openapi/chatdb/traffic/query"
      populationQueryPath: "/openapi/chatdb/population/query"
      gridQueryPath: "/openapi/chatdb/grid/query"
      knowledgeBasesPath: "/openapi/chatdb/knowledge-bases"
      documentsPath: "/openapi/chatdb/documents"
      documentSegmentsPath: "/openapi/chatdb/document-segments"
      knowledgePermissionsPath: "/openapi/chatdb/knowledge-permissions"
      timeoutSeconds: 10
      retryTimes: 2
      tokenExpireSkewSeconds: 120

uiap:
  enabled: false
  baseUrl: ""
  clientId: ""
  clientSecret: ""
  tokenPath: "/oauth/token"
  userInfoPath: "/oauth/userinfo"
  permissionPath: "/openapi/chatdb/permissions/query"
  batchPermissionPath: "/openapi/chatdb/permissions/batch-query"
  timeoutSeconds: 5
  tokenExpireSkewSeconds: 120
  permissionPollIntervalSeconds: 300
  permissionPollPageSize: 500

database:
  master:
    link: "mysql:root:123456@tcp(127.0.0.1:3306)/chatdb?charset=utf8mb4&parseTime=true"
    debug: true
